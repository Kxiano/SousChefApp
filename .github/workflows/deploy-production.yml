name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: false  # Never cancel a production deployment mid-flight

jobs:
  # ── Quality Gate ──────────────────────────────────────────────
  ci:
    name: Quality Gate
    uses: ./.github/workflows/reusable-ci.yml
    secrets: inherit

  # ── Production Deployment ─────────────────────────────────────
  deploy-production:
    name: Deploy to Vercel Production
    needs: ci
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @sous-chef/db exec prisma generate

      - name: Run database migrations (production)
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::No DATABASE_URL secret found in GitHub Secrets. Skipping DB migrations."
            exit 0
          fi
          if [ -z "$DIRECT_URL" ]; then
            export DIRECT_URL="$DATABASE_URL"
          fi
          if [ ! -d "packages/db/prisma/migrations" ] || [ -z "$(ls -A packages/db/prisma/migrations 2>/dev/null)" ]; then
            echo "No migration files found in packages/db/prisma/migrations. Skipping DB migrations."
            exit 0
          fi
          pnpm --filter @sous-chef/db run migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Verify Vercel Secrets
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN secret is missing in GitHub Actions. Please add it in Settings -> Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::error::VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets are missing in GitHub Actions."
            exit 1
          fi

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
